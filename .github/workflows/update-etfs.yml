name: Update ETF data and deploy
on:
  schedule:
    - cron: '23 10 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'docs/**'
      - 'requirements.txt'
      - '.github/workflows/update-etfs.yml'
permissions:
  contents: write
concurrency:
  group: etf-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Fetch and validate all ETF prices
        run: python -m src.update_data
      - name: Fetch category ETF prices
        run: python -m src.update_data --universe config/explore-etfs.json --output docs/explore-data.js
      - name: Retain exact input snapshots for reproducibility
        uses: actions/upload-artifact@v4
        with:
          name: etf-source-${{ github.run_id }}
          path: data/raw/
          retention-days: 14
      - name: Record validated website data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data.js docs/explore-data.js
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated ETF price snapshot'
            git push origin HEAD:main
          fi
      # Pages is configured as main/docs in the repository settings. The
      # successful push above triggers GitHub's built-in Pages deployment.
