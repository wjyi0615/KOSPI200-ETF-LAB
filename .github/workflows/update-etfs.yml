name: Update ETF data and deploy
on:
  schedule:
    - cron: '23 10 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'docs/**'
      - 'requirements.txt'
      - '.github/workflows/update-etfs.yml'
permissions:
  contents: read
concurrency:
  group: etf-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Fetch and validate all ETF prices
        run: python -m src.update_data
      - name: Retain exact input snapshots for reproducibility
        uses: actions/upload-artifact@v4
        with:
          name: etf-source-${{ github.run_id }}
          path: data/raw/
          retention-days: 14
      - name: Record validated website data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data.js
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated ETF price snapshot'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy only after successful collection and tests
        id: deployment
        uses: actions/deploy-pages@v4
